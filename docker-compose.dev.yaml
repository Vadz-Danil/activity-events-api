services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: activity-events-api:dev
    environment:
      LOG_LEVEL: debug
      LOG_FORMAT: console
    volumes:
      - .:/app
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build

  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: activity-events-api:dev
    environment:
      LOG_LEVEL: debug
      LOG_FORMAT: console
    volumes:
      - .:/app
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build

  frontend:
    image: activity-events-frontend:dev
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  go_mod_cache:
  go_build_cache:
  frontend_node_modules:
