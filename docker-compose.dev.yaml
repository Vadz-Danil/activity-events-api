services:
  frontend:
    build:
      target: dev
    image: activity-events-frontend:dev
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  api:
    environment:
      LOG_LEVEL: debug
      LOG_FORMAT: console

  worker:
    environment:
      LOG_LEVEL: debug
      LOG_FORMAT: console

volumes:
  frontend_node_modules:
