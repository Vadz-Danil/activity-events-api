services:
  # Оверрайд для розробки: фронт піднімається vite dev-server-ом із HMR,
  # тека проєкту примонтована в контейнер. Бекенд у цьому режимі — звичайний
  # прод-образ; локально його зручніше ганяти прямо з IDE проти `make infra`.
  frontend:
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  api:
    environment:
      LOG_LEVEL: debug
      LOG_FORMAT: console

  worker:
    environment:
      LOG_LEVEL: debug
      LOG_FORMAT: console

volumes:
  frontend_node_modules:
