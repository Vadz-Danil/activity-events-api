root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/app ./cmd/app"
  bin = "./tmp/app"
  include_ext = ["go", "sql"]
  exclude_dir = ["tmp", "bin", "frontend", "deploy", "docs", ".git", ".github", ".idea"]
  exclude_regex = ["_test\\.go"]
  delay = 300
  stop_on_error = true
  send_interrupt = true
  kill_delay = 2000

[log]
  time = true

[misc]
  clean_on_exit = true
