global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: activity-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]
        labels:
          component: api

  - job_name: activity-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:8080"]
        labels:
          component: worker

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
